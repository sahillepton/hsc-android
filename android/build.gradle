// Top-level build file

buildscript {
    ext {
        kotlin_version = '2.0.21'
    }

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"

        // ✅ Add ONLY if you're using Firebase (google-services.json)
        // classpath 'com.google.gms:google-services:4.4.2'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Force JDK 21 javac on every subproject that compiles Java.
// Capacitor 7 modules declare `compileOptions { sourceCompatibility VERSION_21 }`
// (a source-level check) but do NOT request a toolchain, so without this Gradle
// uses the system JDK (which may be < 21). The foojay resolver in
// settings.gradle pairs with this to auto-download JDK 21 to ~/.gradle/jdks/
// — no system Java install required.
//
// LOCAL TO THIS STANDALONE BUILD ONLY. The client integration uses its own
// build.gradle.kts at integration-main/ root and is unaffected.
subprojects { sub ->
    sub.afterEvaluate { p ->
        if (p.plugins.hasPlugin('com.android.library') ||
            p.plugins.hasPlugin('com.android.application')) {
            p.tasks.withType(JavaCompile).configureEach { task ->
                task.javaCompiler.set(
                    p.extensions.getByType(org.gradle.jvm.toolchain.JavaToolchainService)
                        .compilerFor { spec ->
                            spec.languageVersion.set(JavaLanguageVersion.of(21))
                        }
                )
            }
        }
    }
}
